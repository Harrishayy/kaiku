# ============================================================================================================
# VOICE LINES — the keyed lines Kaiku says (robot, iPhone, Mac, web, glasses). Ground truth (D27).
# Not yet here: the robot hub's own lines (the invitation, step lines, Tap it back, the camera question, Photo time)
# are constants in hub/kaiku_hub; config/AGENTS.md -> "The robot hub" lists them and says why.
# ============================================================================================================
# Clients use KEYS, never their own wording:  GET /v1/voice?lang=en  (all lines as text, for captions)
#                                              GET /v1/voice/<key>?lang=en  (audio/wav, cloud TTS, cached)
# A key is the dotted table name, e.g. [greet.morning] -> "greet.morning". Every line has en, fi and sv.
# Optional `style` overrides config/kaiku.toml [voice].style for that line (how it is spoken, never what).
# Wording rules (root AGENTS.md): short, warm, second person, never clinical, never nagging, no streaks, no
# guilt. "Change from your usual", never diagnosis words. Nothing here is a crisis line: the crisis message is
# scripted in config/safety_phrases.toml and is never synthesised from this file.
# fi / sv are first drafts by the team — have a native speaker read them before the demo.
# ============================================================================================================

# ---------------------------------------------------------------- greetings (by time of day)
[greet.morning]
en = "Good morning. I'm glad you're here."
fi = "Huomenta. Kiva, että olet täällä."
sv = "God morgon. Vad fint att du är här."

[greet.afternoon]
en = "Hi there. How's your afternoon going?"
fi = "Hei. Miten iltapäiväsi sujuu?"
sv = "Hej. Hur går eftermiddagen?"

[greet.evening]
en = "Good evening. Nice to see you."
fi = "Hyvää iltaa. Mukava nähdä sinua."
sv = "God kväll. Kul att se dig."

[greet.night]
en = "Hello, night owl. I'm here."
fi = "Hei, yökyöpeli. Minä olen tässä."
sv = "Hej, nattuggla. Jag är här."
style = "quiet, soft, sleepy"

# ---------------------------------------------------------------- first hello (app setup, first run)
[welcome.hello]
en = "Hello. I'm Kaiku. It's really good to meet you."
fi = "Hei. Olen Kaiku. Tosi mukava tavata."
sv = "Hej. Jag är Kaiku. Vad fint att träffa dig."
style = "warm, unhurried, a small smile in the voice"

[welcome.done]
en = "That's all a check-in is. I'll be here whenever you want me."
fi = "Muuta kirjautuminen ei vaadi. Olen täällä aina kun haluat."
sv = "Mer än så är inte en incheckning. Jag finns här när du vill."
style = "warm, quiet, pleased"

# ---------------------------------------------------------------- weather check (daily dial)
[checkin.ask]
en = "How's the weather inside today?"
fi = "Millainen sää sisälläsi on tänään?"
sv = "Hur är vädret inombords i dag?"

[checkin.mood]
en = "Sunny or cloudy? Turn the dial."
fi = "Aurinkoista vai pilvistä? Käännä valitsinta."
sv = "Sol eller moln? Vrid på ratten."

[checkin.energy]
en = "And your battery?"
fi = "Entä akkusi?"
sv = "Och ditt batteri?"

[checkin.sleep]
en = "How did you sleep?"
fi = "Miten nukuit?"
sv = "Hur sov du?"

[checkin.thanks]
en = "Thank you for telling me."
fi = "Kiitos, että kerroit."
sv = "Tack för att du berättade."

[checkin.cozy]
en = "I'm right here. Want to do something small together?"
fi = "Olen ihan tässä. Tehdäänkö yhdessä jotain pientä?"
sv = "Jag är här. Ska vi göra något litet tillsammans?"

[checkin.skip]
en = "Okay, I'll be here."
fi = "Selvä, minä olen täällä."
sv = "Okej, jag finns här."

# The check-in as a small passing chat (apps): Kaiku's hello when its live voice is not there, and its one warm
# line for what was turned on the dials. Never a number, never a judgement.
[checkin.hello]
en = "Oh, hello. Good to see you. How is today going?"
fi = "No hei. Kiva nähdä. Miten tämä päivä on mennyt?"
sv = "Nämen hej. Vad fint att se dig. Hur har dagen varit?"

[checkin.dials.low]
en = "That sounds like a heavy day. Thank you for telling me. I'm right here."
fi = "Kuulostaa raskaalta päivältä. Kiitos, että kerroit. Olen ihan tässä."
sv = "Det låter som en tung dag. Tack för att du berättade. Jag finns här."

[checkin.dials.tired]
en = "Running on little today. Go gently, small steps are enough."
fi = "Voimat ovat tänään vähissä. Ota rauhassa, pienet askeleet riittävät."
sv = "Krafterna är små i dag. Ta det varsamt, små steg räcker."

[checkin.dials.mid]
en = "Thank you for telling me. An ordinary day counts too."
fi = "Kiitos, että kerroit. Tavallinenkin päivä on arvokas."
sv = "Tack för att du berättade. En vanlig dag räknas också."

[checkin.dials.bright]
en = "That sounds like a good day. I'm glad for you."
fi = "Kuulostaa hyvältä päivältä. Olen iloinen puolestasi."
sv = "Det låter som en bra dag. Jag är glad för din skull."

# ---------------------------------------------------------------- walks (glasses / phone)
[walk.start]
en = "Let's go outside for a bit. I'll come along."
fi = "Lähdetään hetkeksi ulos. Tulen mukaan."
sv = "Vi går ut en stund. Jag följer med."

[walk.light_hunt.1]
en = "Light hunt: can you find three green things?"
fi = "Valojahti: löydätkö kolme vihreää asiaa?"
sv = "Ljusjakt: hittar du tre gröna saker?"

[walk.light_hunt.2]
en = "Now look for something that catches the light."
fi = "Etsi nyt jotain, mikä kimmeltää valossa."
sv = "Leta nu efter något som fångar ljuset."

[walk.light_hunt.3]
en = "Last one: find the brightest patch of sky."
fi = "Viimeinen: etsi taivaan kirkkain kohta."
sv = "Sista: hitta den ljusaste biten av himlen."

[walk.light_hunt.found]
en = "Found it. Lovely."
fi = "Löytyi. Ihanaa."
sv = "Hittat. Fint."

[walk.done]
en = "That was a nice walk. Thank you for taking me."
fi = "Olipa mukava kävely. Kiitos, että otit minut mukaan."
sv = "Det var en fin promenad. Tack för att jag fick följa med."

# ---------------------------------------------------------------- firefly (go / no-go game)
[firefly.intro]
en = "Tap when a firefly glows. Let the moths fly by."
fi = "Napauta, kun tulikärpänen syttyy. Anna yöperhosten lentää ohi."
sv = "Tryck när en eldfluga lyser. Låt nattfjärilarna flyga förbi."

[firefly.done]
en = "Look at all your fireflies tonight."
fi = "Katso kaikkia tulikärpäsiäsi."
sv = "Titta på alla dina eldflugor."
style = "delighted, gentle"

# ---------------------------------------------------------------- breathe
[breathe.intro]
en = "Let's breathe together. Follow me as I grow and shrink."
fi = "Hengitetään yhdessä. Seuraa, kun kasvan ja pienenen."
sv = "Vi andas tillsammans. Följ mig när jag växer och krymper."

[breathe.in]
en = "Breathe in."
fi = "Hengitä sisään."
sv = "Andas in."
style = "slow, calm"

[breathe.out]
en = "And out."
fi = "Ja ulos."
sv = "Och ut."
style = "slow, calm"

[breathe.done]
en = "Nicely done. That was calm."
fi = "Hienosti. Olipa rauhallista."
sv = "Bra gjort. Det var lugnt."

# ---------------------------------------------------------------- tell Kaiku
[tell.prompt]
en = "What was the best bit of yesterday?"
fi = "Mikä oli eilisen paras hetki?"
sv = "Vad var det bästa med i går?"

[tell.thanks]
en = "I like hearing that."
fi = "Tuota on mukava kuulla."
sv = "Det är fint att höra."

# ---------------------------------------------------------------- late night (Mac notch / phone)
[late_night.peek]
en = "It's late. I'm going to sleep. You too?"
fi = "On jo myöhä. Minä menen nukkumaan. Entä sinä?"
sv = "Det är sent. Jag ska sova. Du också?"
style = "sleepy, yawning, soft"

# ---------------------------------------------------------------- garden
[garden.sprout]
en = "Something new is growing in our garden."
fi = "Puutarhassamme kasvaa jotain uutta."
sv = "Något nytt växer i vår trädgård."

[garden.resting]
en = "The garden is resting. It'll be here when you are."
fi = "Puutarha lepää. Se odottaa sinua."
sv = "Trädgården vilar. Den finns här när du är det."

[garden.welcome_back]
en = "Welcome back. The garden missed you."
fi = "Tervetuloa takaisin. Puutarha kaipasi sinua."
sv = "Välkommen tillbaka. Trädgården saknade dig."

# ---------------------------------------------------------------- care team
[needs_call.offer]
en = "Would you like me to let your nurse know you'd like a chat?"
fi = "Haluatko, että kerron hoitajallesi, että haluaisit jutella?"
sv = "Vill du att jag säger till din sjuksköterska att du vill prata?"

[needs_call.sent]
en = "Done. Someone from your care team will get in touch."
fi = "Selvä. Joku hoitotiimistäsi ottaa yhteyttä."
sv = "Klart. Någon från ditt vårdteam hör av sig."

# ---------------------------------------------------------------- general
[general.bye]
en = "See you soon."
fi = "Nähdään pian."
sv = "Vi ses snart."

[general.not_today]
en = "That's fine. Not today."
fi = "Ei se haittaa. Ei tänään."
sv = "Det gör inget. Inte i dag."

[greet.two]
en = "Oh, hello you two!"
fi = "No hei, te kaksi!"
sv = "Nämen, hej ni två!"

# ---------------------------------------------------------------- the invitation (Today card)
# Templates, not finished lines: GET /v1/me/invitation fills {topic} with the person's own stored topic, {when}
# with " yesterday" / " earlier today" / " the other day" and {game} with the game's name, and returns the
# sentence as `text`. Speak that text with POST /v1/voice/say. A line with {placeholders} is never rendered or
# listed by /v1/voice (voice.is_template); `invite.talk.plain` is the sentence when the stored topic cannot be
# said to the person as it stands.
[invite.talk.hard]
en = "You mentioned {topic}{when}. Want to talk about it?"
fi = "Mainitsit{when} asian: {topic}. Haluatko puhua siitä?"
sv = "Du nämnde {topic}{when}. Vill du prata om det?"

[invite.talk.good]
en = "You told me about {topic}{when}. Want to tell me more?"
fi = "Kerroit{when} asiasta: {topic}. Haluatko kertoa lisää?"
sv = "Du berättade om {topic}{when}. Vill du berätta mer?"

[invite.talk.open]
en = "We left off at {topic}. Want to pick it up?"
fi = "Jäimme kohtaan: {topic}. Jatketaanko siitä?"
sv = "Vi slutade vid {topic}. Vill du fortsätta där?"

[invite.talk.plain]
en = "There's something you told me that I'd like to come back to. Want to?"
fi = "Kerroit minulle jotain, mihin haluaisin palata. Palataanko?"
sv = "Du berättade något som jag gärna vill återkomma till. Ska vi?"

[invite.activity.breathe]
en = "Want to take a few slow breaths together?"
fi = "Hengitetäänkö hetki rauhassa yhdessä?"
sv = "Ska vi ta några lugna andetag tillsammans?"

[invite.activity.walk]
en = "Fancy a short walk in the daylight?"
fi = "Lähdetäänkö lyhyelle kävelylle päivänvaloon?"
sv = "Vad sägs om en kort promenad i dagsljuset?"

[invite.activity.tell]
en = "Want to tell me about your day?"
fi = "Haluatko kertoa minulle päivästäsi?"
sv = "Vill du berätta om din dag?"

[invite.activity.game]
en = "Fancy a round of {game} now?"
fi = "Pelataanko nyt: {game}?"
sv = "Sugen på en omgång: {game}?"

# ---------------------------------------------------------------- an activity they said yes to (D50)
# Templates like the invitation's: GET /v1/me/invitation fills {activity} with the activity's name
# (config/kaiku.toml [agree.names]) and returns the sentence as `agreed[].text`, for the Today card and the
# notification. One per place it was agreed in; `agreed.plain` when the place has no sentence of its own.
# Never the person's words, never rendered as a line of its own.
[agreed.robot]
en = "With the robot you said yes to {activity}. Ready when you are."
fi = "Sanoit robotin kanssa kyllä: {activity}. Valmiina, kun sinä olet."
sv = "Med roboten sa du ja till: {activity}. Redo när du är det."

[agreed.glasses]
en = "On your walk you said yes to {activity}. Ready when you are."
fi = "Sanoit kävelyllä kyllä: {activity}. Valmiina, kun sinä olet."
sv = "På promenaden sa du ja till: {activity}. Redo när du är det."

[agreed.iphone]
en = "On your phone you said yes to {activity}. Ready when you are."
fi = "Sanoit puhelimella kyllä: {activity}. Valmiina, kun sinä olet."
sv = "På telefonen sa du ja till: {activity}. Redo när du är det."

[agreed.mac]
en = "On your Mac you said yes to {activity}. Ready when you are."
fi = "Sanoit Macilla kyllä: {activity}. Valmiina, kun sinä olet."
sv = "På din Mac sa du ja till: {activity}. Redo när du är det."

[agreed.plain]
en = "You said yes to {activity}. Ready when you are."
fi = "Sanoit kyllä: {activity}. Valmiina, kun sinä olet."
sv = "Du sa ja till: {activity}. Redo när du är det."

