# Dev/demo broker. LAN only — run on the hub laptop / demo hotspot, never on venue Wi-Fi exposed.
# For auth: create a password file (mosquitto_passwd -c config/mosquitto.passwd kaiku),
# set allow_anonymous false + password_file, and put MQTT_USER/MQTT_PASS in .env.
listener 1883
allow_anonymous true
persistence false
# The head's speaker and microphone travel as 20 ms sound frames (audio/head/*): send each at once, never batched.
set_tcp_nodelay true
log_dest stdout
log_type error
log_type warning
log_type notice
