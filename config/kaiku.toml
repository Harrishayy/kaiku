[gemma]
# One switch for every Gemma call in the cloud (cloud/kaiku_cloud/llm/gemma.py): practitioner review, record
# questions, the companion's shared mind, nightly graph organisation, and the `KAIKU_LLM=auto` explanation chain.
provider = "hosted"   # "hosted" = Gemma through the Gemini API (verified) | "modal" = our vLLM app kaiku-gemma (deploy it first)

[gemma_modal]
timeout_s = 60        # result wait per call when provider = "modal". A cold GPU start took 235 s (2026-11-15): the first call
                      # after an idle spell falls back to the deterministic text and is left running so the GPU comes up;
                      # calls inside scaledown_s after that are answered (the review took 10.5 s warm)
adapter_repo = ""     # optional LoRA adapter (HF repo) served by gemma_app.py on top of the base weights; empty = base model. No Kaiku adapter has been trained.
# Separate scale-to-zero Modal app `kaiku-gemma` (cloud/gemma_app.py). Costs nothing until called.
gpu = "H100"          # 26B-A4B in bf16 needs ~52 GB; use "L40S" with google/gemma-4-12B-it to save credits
scaledown_s = 300     # container stops this long after the last call. Shorter than a practitioner's visit and the GPU
                      # is gone again before the second question; each idle tail costs about $0.38 on an H100
max_model_len = 16384  # prompt + answer. The practitioner review sends about 21 000 characters of evidence: 8192 refused it
max_output_tokens = 1200  # answer cap per call unless the caller asks for more (same as [gemma_hosted])

