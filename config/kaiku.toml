# ---- sleep and body (the watch's daily summary). Sleep first, with its stages and the time awake beside it (D53);
# then the heart; then the whole day's movement: steps, distance walked, time in daylight, exercise. The day's
# distance and daylight live here and not under "Walks and outings": that group holds walks recorded one by one
# (it has its own "Daylight on walks"), these are totals of the whole day from Apple Health, like the steps.
# Which day a number stands under: the summary is dated the morning it was made. Its sleep is the night that ended
# that morning and stays on that date. Its heart numbers, steps, distance, daylight and exercise are the day
# before's (midnight to midnight): `day_offset = -1` puts each on the day it is of, so yesterday's walking is never
# shown as today's. The practitioner side and the rule keep the summary's date (cloud/AGENTS.md says so); the
# session row of such a measure lists only that day's numbers and is stamped at the end of that day.
[[history.measure]]
key = "watch_sleep"
group = "sleep_body"
title = "Sleep"
format = "duration"
[[history.measure]]
key = "deep_sleep"
group = "sleep_body"
title = "Deep sleep"
format = "duration"
[[history.measure]]
key = "rem_sleep"
group = "sleep_body"
title = "REM sleep"
format = "duration"
[[history.measure]]
key = "core_sleep"
group = "sleep_body"
title = "Core sleep"
format = "duration"
obs = "obs.wearable_daily"
field = "sleep_core_min"
agg = "last"
min_mad = 10.0   # her usual range is never drawn narrower than this many minutes each way (as for deep sleep)
[[history.measure]]
key = "awake_night"
group = "sleep_body"
title = "Awake in the night"
format = "duration"
[[history.measure]]
key = "sleep_midpoint"
group = "sleep_body"
title = "Middle of the night's sleep"
format = "clock"
[[history.measure]]
key = "resting_hr"
group = "sleep_body"
title = "Resting heart rate"
unit = "bpm"
day_offset = -1
[[history.measure]]
key = "walking_hr"
group = "sleep_body"
title = "Walking heart rate"
unit = "bpm"
day_offset = -1
[[history.measure]]
key = "hrv_sdnn"
group = "sleep_body"
title = "Heart rate variability"
unit = "ms"
day_offset = -1
[[history.measure]]
key = "daily_steps"
group = "sleep_body"
title = "Steps"
unit = "steps"
day_offset = -1
[[history.measure]]
key = "day_distance"
group = "sleep_body"
title = "Distance walked"
unit = "km"
decimals = 1
day_offset = -1
[[history.measure]]
key = "day_daylight"
group = "sleep_body"
title = "Time in daylight"
format = "duration"
day_offset = -1
[[history.measure]]
key = "exercise_min"
group = "sleep_body"
title = "Exercise"
unit = "min"
obs = "obs.wearable_daily"
field = "exercise_min"
agg = "last"
day_offset = -1

