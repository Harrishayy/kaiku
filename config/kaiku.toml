[face_cue]
# When Kaiku goes a little gentler after a quiet face during a task (cloud/kaiku_cloud/mind/face_cue.py, D52).
# With her switch "Camera during activities" on, the phone or Mac counts face movement in games and the check-in
# chat (obs.face_signs). The voice model is never given a number or told what was counted: only "go gently, and
# never mention their face or a camera", on the context card and on a `feel` plan. It changes no state.
enabled = true
z = 2.0                  # "clearly below": at least this many spreads below her own usual today (the charts mark 2.0 too)
min_baseline_days = 7    # only against an established usual: this many of her own days, never the provisional early baseline
# kind of task -> the config/criteria.toml metrics read for it. The cue holds for a kind when at least one of its
# metrics with a reading today is `z` or more below her usual and none is above it. Blink rate is not a cue.
cue_kinds = ["lower", "tense"]   # visible expression cues (D60, obs.face_signs `cues`) that also make a kind of task
                                 # "quieter" today, with no baseline needed: they are measured against the person's
                                 # own level inside that task. `brighter` never makes Kaiku go gentler
cue_min_seconds = 4.5            # a cue counts here only when it held at least this long in total in that task
[face_cue.metrics]
games = ["face_range", "face_smiles", "face_range_landmarks"]
check_in = ["face_range_chat", "face_smiles_chat", "face_range_chat_landmarks"]

[expression_cue]
# Visible expression cues (D60). With her switch "Camera during activities" on, the phone or Mac looks, in memory,
# for a kind of expression that HOLDS for a while against her own level earlier in the same task: lower (less
# smiling with the mouth corners down or the inner brows up), tense (brows drawn down with pressed lips or narrowed
# eyes), brighter (sustained smiling). It is named for what is seen, never for what is felt. In an open check-in
# conversation a cue may put ONE quiet context turn in front of Kaiku ("if it fits, ask one short open question");
# Kaiku never says it saw her face. The counts go into obs.face_signs `cues`: shown and citable, not scored.
# These thresholds go to the device with the session (CompanionSessionResponse.expression_cue). Not calibrated
# against people yet: change them here, no new app build.
enabled = true
speak = true                 # false = cues are only recorded, never handed to the conversation
settle_s = 8                 # face time before anything can hold; her own level in this task comes from it
sustain_s = 4.5              # it must hold this long without a break
rise = 0.15                  # this far above her own level in this task (0 to 1 strengths)
min_gap_s = 90               # at most one cue handed to the conversation in this long
max_per_conversation = 3

[care_passages]
# Approved, non-clinical passages ask_mind may cite as [doc:<key>] for care questions. The care team owns these.
care_team = "Questions about treatment, medicines or appointments are best answered by your care team. Kaiku can help you write the question down so you remember to ask."
contact = "You can reach your care team through the clinic's usual phone line or message service during office hours."
booster = "Some people get extra sessions later on. Whether that fits you is something to talk about with your care team."
everyday = "Small everyday things often help after treatment: daylight, moving a little, regular meals and staying in touch with people."

[week]
# Dashboard "this week" (cloud/kaiku_cloud/week.py, D34). Routines are found in the usual weeks before the last 7 days.
usual_weeks = 3          # weeks of "usual" before this week
min_occurrences = 3      # fewer days than this in the usual weeks = not a routine
daily_share = 0.8        # share of usual days with it -> "every day"
most_days_share = 0.45   # -> "most days"; below: a weekday rhythm if that weekday had it in weekday_min_weeks weeks
weekday_min_weeks = 3
kept_ratio = 0.8         # this week's days / usual per week >= this -> kept
partly_ratio = 0.5       # >= this -> partly, below -> slipped
sleep_shift_min = 45     # median sleep onset this week within ± this of usual -> kept (beyond 2x -> slipped)
helped_min = 0.4         # bandit mean effect (0..1): the best-responding activities at or above this "help most"
helped_min_tries = 3
max_items = 6            # per list
max_metric_items = 3     # care team: drifting metrics listed one by one (the rest summarised in one line)

[gemma_hosted]
clinician_ask_cooldown_s = 15 # cache exact questions/evidence and bound new record-chat requests
explanation_cooldown_s = 300 # coalesce incoming updates; never call Gemma once per dashboard poll
thinking_level = "minimal" # grounded bounded JSON; avoid hidden reasoning exhausting the output cap
timeout_s = 45 # hosted reasoning may take longer than a short voice request
max_output_tokens = 1200 # allow a complete structured explanation; validated before use

[insight]
# Practitioner insight (cloud/kaiku_cloud/insight.py, GET /v1/patients/{id}/insight).
cooldown_s = 60            # at most one Gemma review per person per minute; new evidence shows the template meanwhile
timeout_s = 30             # one hosted Gemma call; the dashboard can load with generate=false first
max_evidence = 60          # citable records sent to the model (course and changes first)
max_shown_evidence = 12    # on top of those: records of measures that are shown and not scored (camera face signs D52, more of the day from Apple Health D53); they never take one of the 60 places
course_days = 28           # how far back the course of change looks for a first day away from usual
min_days_per_week = 2      # recorded days needed in a week before its median is compared
similar_scale = 0.5        # week medians within this many baseline scales = "about the same"
usual_scale = 1.0          # this week's median within this many baseline scales of the usual = "within their usual"
help_early_tries = 3       # fewer attempts than this = too early to rely on
help_consistent_tries = 8  # at least this many attempts and a narrow interval = consistent
reflection_labels_per_night = 4  # reflections Gemma relabels per home in one nightly run (newest first)
reflection_label_at_episode_end = true  # one Gemma call right after an opted-in conversation: level, themes, tone, energy (rules stand if it fails)

[debug_day]
# One local day of one home, for developers (GET /v1/debug/day, cloud/kaiku_cloud/debug_day.py). Never for a
# practitioner or the person; closed like /v1/admin on a deployed service.
payload_list_items = 8     # a longer list in an envelope payload is cut to this many items plus a count
event_ids_per_metric = 20  # envelope ids listed per metric
slight_z = 1.0             # reading: a scored measure at least this many spreads from its usual = slight_shift
clear_beyond = 2           # reading: this many scored measures beyond their own threshold on the day = clear_shift
min_scored = 3             # reading: fewer scored measures with a value and a baseline than this = not_enough_data
moved_max = 8              # measures the deterministic read lists as moved (largest first)
missing_max = 8            # measures listed as missing (a silent signal group is always listed)
max_event_facts = 12       # envelopes of the day the read may cite (those behind the measures that moved first)
face_event_facts = 4       # of those, the day's camera face-sign records are always listed first, up to this many (D52)
timeout_s = 60             # one hosted Gemma call for the read
max_output_tokens = 2400   # the read is longer than [gemma_hosted].max_output_tokens allows: a first real call stopped unfinished at 1200
cooldown_s = 60            # at most one generated read per home and date in this time (a day's data can change)
changed_max = 12           # "changed since the day before" items the consensus fact lists (the state's own first), then a count
# What the model is told, after what was wrong, when its first answer did not pass every check (one retry).
retry_note = "Cite only the given ids, at most six per item, put each item in the section its facts belong to, keep each text under 400 characters, and take every number, every status word and every yes or no (held, acknowledged, safety flag, enough data, scored, beyond or within its threshold on this day) from the fact the item cites, name measures and groups by their labels (no ids or keys in the text), each in its own role: the value, the usual, the distance above or below, the spreads, the days, the weight."
# The read's instruction. The reading itself (as_usual | slight_shift | clear_shift | not_enough_data) is decided
# by code and given to the model; every claim is checked by code afterwards (ids exist, every number is in a
# cited fact and in its own role, every yes or no is the cited fact's, wording, section). The consensus is never
# the model's. Editing this text retires the cached reads (it is part of their digest).
prompt = """You are reading ONE day of one home's record for the developers of Kaiku, a system that compares a person's daily signals with that person's own usual. FACTS are verified lines written by code: each has an id, a label and a detail. The consensus state is decided by a deterministic rule; you explain the day to the developers, you never decide, change or second-guess the state as if you were the rule.
Return ONLY JSON: {"summary": {"text": "...", "cites": [ids]}, "moved": [{"text": "...", "cites": [ids]}], "missing": [{"text": "...", "cites": [ids]}], "tomorrow": [{"text": "...", "cites": [ids]}], "rule_check": {"text": "...", "cites": [ids]}}.
summary: two or three sentences. DAY.reading says whether the day is as usual, a slight shift, a clear shift or has not enough data: say that in those words (the consensus fact gives the counts behind it: how many scored measures are beyond their threshold on this day and how many are at least one spread from their usual). Then name what carries it, by label: the groups that are worse and the measures furthest from their usual. Cite consensus:state and the facts you name.
moved: one item for each id in DAY.moved, in that order (code has already chosen them: the measures furthest from their usual on this day). Each item cites its own metric: fact (and an event: fact when it shows where the value came from) and repeats that fact's detail part by part, in this order: the value on this day, the usual, the distance above or below the usual, the spreads, whether that is within or beyond its threshold on this day, on how many of the last scored days it was beyond, its status word exactly as the fact gives it (drifting, normal, improved or insufficient: a measure can be beyond on some days and still be normal), and whether it is scored (with its weight) or observe-only. Two examples of the form, with made-up numbers: "Sleep is 322 against a usual of 428: 106 below, 4.3 spreads below, beyond its threshold on this day; beyond on 3 of the last 5 scored days (drifting); scored, weight 1." and "Steps is 5100 against a usual of 4800: 300 above, 1.1 spreads above, within its threshold on this day; beyond on 1 of the last 5 scored days (normal); scored, weight 0.5." Empty list when DAY.moved is empty.
missing: what the day lacks: a signal group that sent nothing, a measure that usually reports. At most four items; each cites a missing: fact (one item may cite several). Empty list when FACTS has none.
tomorrow: what would change a group's verdict or the state tomorrow. First one item for the tomorrow:state fact when FACTS has it: only that fact says what the state itself does next, so an item that speaks of the state cites it and says it as the fact does. Then one item for each tomorrow:group_ fact: a group could turn worse or could leave worse, which is about that group's verdict, not about the state. Then, if any are left, the measures that are each one day short of starting or ending a drift, those of one group together in one item citing their tomorrow: facts. At most five items. Empty list when FACTS has none.
rule_check: two or three sentences for a developer checking the rule: how many groups are worse and how many needs_call takes and watch takes (the consensus fact gives all three numbers); then whether the state is held by hysteresis, whether it is acknowledged and whether a safety flag is open, each as that fact states it (it states all three, yes or no); then what is borderline (a measure just past or just short of its threshold, a verdict that rests on one measure, an early baseline, the day itself reading differently from the last scored days). Cite consensus:state and the source: facts you rely on.
Rules:
- Every number you write must be written in the detail of a fact that the same item cites, as it is written there. Do not calculate, do not combine numbers, write no dates and no times that are not in a cited fact.
- A yes or a no (the state held, acknowledged, a safety flag open, a group having enough data, a measure scored, a measure beyond or within its threshold on this day) is said only as a fact the same item cites says it. A measure is beyond its threshold on this day only when its fact says "on this day"; being beyond on some of its last scored days is its drift, not this day.
- Cite only ids from FACTS, never more than six in one item (split the item instead), and only facts the sentence is about. Ids go in cites, never in the text: no brackets, no id, no key such as outing_min; name a measure or a group by its label.
- Each text stays under 400 characters.
- Say what the record shows. Never diagnose, never predict, never name a condition, never say relapse, never suggest treatment.
- Order in time is not cause: never say that one measure caused another.
- Plain, specific sentences. No filler such as overall, various, in general, well-being.
"""

[graph]
# The knowledge graph as a map (cloud/kaiku_cloud/graph_map.py -> PatientInsight.graph, the dashboard's Knowledge
# graph panel). What every node is ABOUT is declared here once, so the picture never guesses it. Each neighbourhood
# ([[graph.domain]]) lists what belongs to it and where it sits around the person (place: n ne e se s sw w nw; the
# same for every person, so a practitioner finds sleep in the same spot in every record).
# A measure is placed by its name under `measures` first, otherwise by its observation type under `obs`
# (config/criteria.toml says which observation type feeds which metric). Anything not listed has no neighbourhood.
days = 28          # days of per-day data the graph carries (the day scrubber); the course looks back [insight].course_days
follow_days = 3    # a measure "followed" when it moved away within this many days of the first change (as the course summary)
back_days = 7      # "came back after the care action" is said for measures back within this many days of it
together = 6       # at most this many "away on the same days" links, the closest overlaps first

[graph.produces]
# activity (cloud week.ACTIVITIES key) -> the observation types a session of it yields readings in. Its measures
# follow from config/criteria.toml (every enabled metric with that `obs`); a metric name instead of an observation
# type links that one measure. A person's graph has the link only for the days both were recorded.
ritual = ["obs.presence", "obs.self_report", "obs.speech_features"]   # greeting, the three dials, the talk
drum = ["obs.drum_session"]
breathe = ["obs.hrv_session"]
walk = ["obs.outing"]
checkin = ["obs.self_report", "face_range_chat", "face_smiles_chat", "face_range_chat_landmarks"]   # + what the camera counted in the chat (D52)
laptop = ["obs.laptop_session"]
play = ["obs.play_session", "face_range", "face_smiles", "face_blinks", "face_range_landmarks"]   # + camera face signs in games (D52)
sleep = ["watch_sleep", "sleep_midpoint", "deep_sleep", "rem_sleep", "awake_night"]   # the sleep-onset time is worked out from the first two; the stages and the time awake are the same night (D53)

[graph.about]
# reflection theme (cloud mind/affect.py THEMES) -> the nodes it sits beside, when the person's graph has them.
# A declared "is about the same part of life", never something learned and never the person's words.
outdoors = ["activity:walk"]
sleep = ["routine:sleep"]
routine = ["activity:ritual"]

