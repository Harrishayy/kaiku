# Non-secret settings. Secrets go in .env (local) or Modal secret `kaiku-secrets` (cloud).
# Env vars override: KAIKU_<SECTION>_<KEY> (e.g. KAIKU_RITUAL_DRUM_S=30).

[home]
id = "demo-aino"
language = "en"            # en | fi  (D9: Finnish greeting + English conversation)
greeting_language = "en" # English-only product/demo release; retain safety phrase coverage in every language.

[models]
# Verified in the Gemini docs (geminiDocs MCP) 2026-11-14. Model names change: re-check before a deploy.
gemini_live = "gemini-3.8-live"
lyria_realtime = "lyria-realtime-exp"
gemini_flagship = "gemini-4-argon"         # orchestration / reflection / eval judge (Hydrogen/Carbon: not listed yet)
gemini_fast = "gemini-3.8-flash"           # bulk text: explanations fallback, simulated persons in evals
tts = "gemini-3.8-flash-tts"              # GA 2026-09-22, Interactions API; used by the cloud /v1/voice
tts_lite = "gemini-3.8-flash-lite-tts"    # cheaper on-demand alternative
gemma_hosted = "gemma-4-26b-a4b-it"       # larger: gemma-4-31b-it
# VERIFY Hugging Face repo id (org prefix) + licence acceptance (D5: smallest instruct variant first)
gemma_hf_repo = "google/gemma-4-26B-A4B-it"  # checked on HF 2026-11-14; smaller: google/gemma-4-12B-it (fits L40S)

[voice]
# D27: ONE voice for Kaiku everywhere (Gemini Live on the robot + cloud TTS for apps/glasses).
# Prebuilt voice names: Gemini docs "speech-generation#prebuilt-voices" (Sulafat = "Warm").
name = "Sulafat"
model = "gemini-3.8-flash-tts"
style = "warm, gentle, unhurried, softly smiling; a small friendly companion"
cache_dir = "logs/voice_cache"           # rendered audio (wav), keyed by model+voice+lang+text hash
timeout_s = 20
lang_codes = { en = "en-US", fi = "fi-FI", sv = "sv-SE" }
audio = "auto"      # auto | head | local. Where Kaiku's Live voice on the robot speaks and listens. head = the robot
                    # head's own speaker and microphone, as PCM over the bus (no sound device on the hub machine);
                    # local = the hub machine's sound card; auto = the head when a real head (not a sim twin) is alive
                    # on the bus as the conversation opens, else the sound card if there is one. Env: KAIKU_VOICE_AUDIO
phone_mic_tail_ms = 400  # a phone beside the robot as its microphone (audio/phone/mic, D56; the app's "Robot microphone"
                    # switch on Kaiku bot): what the phone hears while the head's speaker has sound of ours, and this
                    # long after, is dropped by the hub (the head's buffer + the room), so Kaiku never hears herself

[live]
# Gemini Live session setup the cloud locks into the apps' ephemeral token (cloud/kaiku_cloud/mind/live_token.py).
# Continuous conversation: Gemini's automatic VAD takes turns, speaking over Kaiku interrupts it (barge-in).
# Field names + enums: Gemini Live API reference "AutomaticActivityDetection" (geminiDocs MCP, 2026-11-14).
start_sensitivity = "START_SENSITIVITY_LOW"   # fewer false starts from room noise / TV
end_sensitivity = "END_SENSITIVITY_LOW"       # people pause mid-thought: don't cut them off
prefix_padding_ms = 120
silence_ms = 900                              # quiet this long = the person's turn is over
affective_dialog = false                      # the Live guide lists it as supported on gemini-3.8-live (v1beta, enable_affective_dialog), but true closes the session with 1007 "invalid argument" on the first turn (real calls 2026-11-14: SDK, raw key and token endpoint). Leave off until a real call passes.
feel_scheduling = "WHEN_IDLE"                 # FunctionResponse scheduling for the non-blocking `feel` tool (INTERRUPT | WHEN_IDLE | SILENT). Real Live sessions 2026-11-14: the model calls `feel` before it speaks; with WHEN_IDLE it then answers using the plan, with SILENT it said nothing that turn.
proactive_audio_purposes = ["walk"]           # setup.proactivity.proactiveAudio only for these purposes, on every surface; off for all others (D49). "The model can reject responding to the last prompt" (Live API reference, ProactivityConfig): right for a walk's own look and quiet nudges (a declined nudge has no words; the device drops its audio, see [walk]); wrong for a talk, a check-in and the ritual, where a plain statement like "it has been a hard day" went unanswered in a real check-in. The robot's own Live session (hub live_config) never sets it.
transcription_language_hint = true            # inputAudioTranscription.languageCodes = the session language's code from [voice] lang_codes (en -> en-US), on every Live session (robot, iPhone, Mac, glasses through the iPhone). "BCP-47 language codes providing hints about the languages present in the audio. If omitted or empty, defaults to automatic language detection" (Live API reference, AudioTranscriptionConfig): without it English speech came back transcribed as German (2026-11-15). false = automatic detection again
context_compression = true                    # sliding window. Without it Gemini ends an audio-only session at 15 minutes and one with camera frames at 2 (Live session-management guide, 2026-11-14)
session_max_minutes = 5                      # clients stop at this limit; cloud reserves estimated token-session cost
talk_max_minutes = 30                        # a Talk on the phone or Mac is like a call: the person sets the length (purpose/intent talk)
walk_max_minutes = 30                        # a walk with Kaiku in the ear
token_minutes = 5                            # one ephemeral token and its budget reservation cover at most this long; a longer call resumes (resume_session_id) and gets the next token. Five keeps a short talk's reservation what it was before calls could run long; Gemini resets a Live connection after about ten minutes anyway (session-management guide)
idle_end_s = 180                             # CompanionSessionResponse.idle_end_s: the device ends a conversation after this long with nobody speaking (an open microphone in a pocket)
walk_idle_end_s = 900                        # ... on a walk, where long quiet stretches are normal
settle_min_minutes = 1                       # a Live reservation never settles below this many started minutes (kaiku_contracts.budget)
settle_grace_s = 10                          # seconds added when the cloud itself sees a conversation end (end_session, crisis): the goodbye is still being spoken
reconnect_attempts = 2                       # bounded recovery during an explicitly started conversation
mind_timeout_s = 120                       # bounded shared reasoning wait; audio receive remains responsive
context_refresh_seconds = 15                 # active sessions receive bounded source-labelled activity updates
hub_transcripts = false                     # explicit household opt-in before robot transcripts may be persisted
mic_gap_end_s = 1.0                         # robot: microphone frames missing this long (the head sends none while its own speaker plays) = tell Live the stream paused; a gap is never filled with silence. 0 = never tell

[walk]
# Walking together (cloud/kaiku_cloud/mind/walk.py; persona: "Walking together"). A Live session only answers input,
# so the device nudges: it sends `look_prompt` as a context text turn every `look_every_s` while the camera is on
# and nobody is speaking, and `quiet_prompt` once after `quiet_after_s` without anyone speaking. Kaiku answers a
# nudge in words only when there is something to say. A declined nudge is not always silent (real sessions
# 2026-11-14: 9 of 14 carried a second or two of non-speech sound), so the device plays a nudge's reply only once
# its output transcription has a real word. A `stay_quiet` tool call gave exact silence but made remarks arrive one
# look late, about the previous view; it is not used. 0 = that nudge is not used.
default_style = "quiet"                       # CompanionSessionRequest.walk_style when the device sends none
outdoor_likes = 4                             # notebook places / outdoor likes carried on the walk card

[walk.quiet]
look_every_s = 30
look_prompt = "A look around, not said by them. Only if something plainly worth it is in view (striking light, water, a tree in blossom, an animal, something that looks like one of their own places), say one short remark about it. Ordinary ground, road, wall or sky: answer with silence."
quiet_after_s = 0
quiet_prompt = ""

[walk.playful]
look_every_s = 20
look_prompt = "A look around, not said by them. If a spotting game is on and one of the things may be in view, ask if that is one. If no game is on and something in view would make a small game, offer it. Something striking gets one bright remark. Nothing worth it: answer with silence."
quiet_after_s = 60
quiet_prompt = "It has been quiet for a while, not said by them. You may offer one small game from what is around, or one playful question about their own day. If they seem to want the quiet, answer with silence."

[walk.chatty]
look_every_s = 20
look_prompt = "A look around, not said by them. Say one friendly thing about what is in view, or connect it to something of theirs as a question. Nothing worth a word: answer with silence."
quiet_after_s = 40
quiet_prompt = "It has been quiet for a while, not said by them. You may speak first: ask about their day, pick up what was left open, or bring up one thing they told you. One short turn."

[agree]
# An activity the person said yes to in a conversation, held by the cloud for that local day so every screen shows
# the same thing (D50; cloud/kaiku_cloud/mind/agree.py). The voice calls `agree_activity`; code decides.
max_open = 3                 # open or started items a home may have at once (one per kind); more is refused
keep = 40                    # items kept in a home's list; past days are never shown, this only bounds the row
clock_slack_s = 120          # an observation stamped up to this long before the yes still completes it (device clocks)
screen_days = 30             # a phone or Mac is one of the person's screens when its app asked for this home, or sent observations, within this many days
# The person's own words (`said`, checked and never stored) must carry a yes or their own ask, and no hedge or no.
# Regular expressions on the lower-cased words; each is matched as whole words (the code adds the word edges).
# A hedge or a no anywhere wins over a yes ("okay, maybe later").
yes = [
  "yes|yeah|yep|yup|ok|okay|sure|alright|all right|definitely|absolutely|of course|please|gladly|deal",
  "let['’]?s", "why not", "good idea", "go on", "count me in", "can do",
  "(?:sounds|that['’]?s|that is|that would be|that['’]?d be) (?:good|nice|great|lovely|fine|perfect)",
  "i(?:['’]d| would) (?:like|love) (?:that|to)", "i['’]?ll (?:do|try|go|play|take|give)", "i will",
  "i['’]?m (?:in|up for)", "joo|kyllä|okei|mennään|gärna|javisst",
]
# Their own initiative: on an extra-gentle day only this is kept (Kaiku makes no offers then).
ask = [
  "(?:can|could|shall|may) (?:we|i|you)", "i (?:want|need|fancy|feel like)",
  "i(?:['’]d| would) (?:like|love) to", "remind me", "i(?:['’]m| am) going to",
  "put (?:it|that|this|a|the) .*on my", "save (?:it|that|this)",
]
hedge = [
  "maybe", "perhaps", "possibly", "might", "not sure", "i (?:don['’]?t|do not) know", "dunno",
  "(?:we|i)['’]?ll see", "depends", "i guess", "i suppose", "think about it",
  "if i (?:feel|can|have|get|manage)", "(?:some|an)other (?:time|day)",
  "not (?:now|today|really|yet|right now|this time)", "ehkä", "kanske",
]
no = [
  "^no", "no[, ]+thanks?", "nope", "nah", "i(?:['’]d| would) rather not",
  "(?:don['’]?t|do not) (?:want|feel like|fancy)", "not for me", "too tired", "leave it",
]

[agree.names]                # how each activity is called in the sentence on a screen ("... you said yes to Lantern.")
breathe = "breathing together"
tell = "Tell Kaiku"
walk = "a walk"
lantern = "Lantern"
seeds = "Seed shelf"
watering = "Watering"
pebbles = "Pebbles"
firefly = "Firefly"
drum = "a drum jam"
light_hunt = "a spotting game"

[agree.where]                # how the voice says where it put it ("It's on your phone and your Mac.")
iphone = "your phone"
mac = "your Mac"

# Which observation, arriving for that home the same local day and not before the yes, completes an agreed
# activity without anyone tapping anything: its type and, where given, payload fields that must match.
[[agree.done_by]]
kind = "walk"
type = "obs.outing"
[[agree.done_by]]
kind = "breathe"
type = "obs.play_session"
game = "breathe"
[[agree.done_by]]
kind = "breathe"
type = "obs.hrv_session"
[[agree.done_by]]
kind = "breathe"
type = "obs.ritual"
step = "breathe"
status = "completed"
[[agree.done_by]]
kind = "tell"
type = "obs.play_session"
game = "tell"
[[agree.done_by]]
kind = "lantern"
type = "obs.play_session"
game = "lantern"
[[agree.done_by]]
kind = "seeds"
type = "obs.play_session"
game = "seeds"
[[agree.done_by]]
kind = "watering"
type = "obs.play_session"
game = "watering"
[[agree.done_by]]
kind = "pebbles"
type = "obs.play_session"
game = "pebbles"
[[agree.done_by]]
kind = "firefly"
type = "obs.play_session"
game = "firefly"

[stream]
# GET /v1/me/stream (cloud/kaiku_cloud/stream.py, D50): Server-Sent Events the apps keep open while they run.
heartbeat_s = 15             # a `ping` whenever nothing else was sent for this long; a client that sees no frame for well over twice this reconnects
retry_ms = 2000              # the reconnect delay the stream suggests (SSE `retry:`)
replay = 200                 # events kept per home for a reconnect with Last-Event-ID; further back = `hello.resync`
queue = 64                   # events that may wait for one listener; a listener that falls further behind is closed, never waited for
max_listeners = 12           # open streams per home; one more closes the oldest
hide_types = ["obs.safety_flag", "obs.phq9"]   # never named in a `day` event (the event is still sent, so screens refresh)

[attention]
# Robot attention ladder (hub/kaiku_hub/attention.py): nobody -> appeared -> approaching -> at_desk.
face_source = "laptop"   # laptop (hub camera, OpenCV) | unoq_yolo (UNO Q App Lab boxes on raw/hub/face) | off
lost_s = 2.0             # face gone shorter than this = detector flicker, same visit
approach_size = 0.12     # face width / frame width: "coming closer"
at_desk_size = 0.22      # ... "at the desk"
frame_s = 0.3            # detections this close in time are one camera frame (two faces = two messages)
two_face_min_sep = 0.25  # x_norm distance that makes two detections two people
camera_hfov_deg = 60     # face x_norm -1..1 spans -30..+30 deg
camera_on_head = true    # the USB camera sits in the head and pans with it (D32): targets are relative to raw.head.pan
pan_limit_deg = 100      # head travel either side of front (12:40 gear, cable bundle through the neck)
pan_deadband_deg = 4
pan_smoothing = 0.4
pan_speed = 0.4
track_hz = 5
regreet_h = 3            # greet at most once per 3 h
night_start = "23:00"    # no greeting in [night_start, night_end) unless the person starts; equal = off
night_end = "07:00"
quiet_h = 2              # "not now" / "quiet" keeps Kaiku quiet this long
voice_timeout_s = 3      # GET /v1/voice/{key}; slower -> local fallback

[robot]
# Robot build (docs/plans/07-robot-electronics.md, D31 + D32): Atech board in the body (Color Display eyes, Knob ear,
# button, speaker, mic, pan motor; no LED grids) + UNO Q (Modulino Buzzer, USB camera; no KY-053, D54; no KY-031 knock, D55).
# No KY-054 (room light from the camera) and no KY-035/magnet (home = head position at power-on): D39.
dial_input = "ear"       # ear (Atech Knob: turn 1-5, press to confirm) | button (1-5 presses, if the knob is out)
press_window_s = 4.0     # button mode only: presses closer than this make one answer
drum_input = "imu"       # imu (the head's orientation sensor: force in g; this build, D55) | knock (KY-031: timing only) — what the sims send
drum_sway = false        # no head sway while drumming: taps are ignored while the pan motor moves (it shakes the sensor)
# Head-firmware numbers (motor pulses, homing, hub-silence stop, debounce): firmware/atech-head/kaiku_link/config.h

[unoq]
# UNO Q Linux app (firmware/unoq-sensors/python/): camera -> derived numbers only, frames never stored or sent.
camera_index = -1        # -1 = auto (stable /dev/v4l/by-id name); the UNO Q renumbers video0-3 between boots
frame_w = 640
frame_h = 480
fps = 15
face_hz = 5              # face boxes on raw/hub/face (attention ladder, presence)
face_detector = "haar"   # haar (OpenCV bundled) | yunet (needs the model file, VERIFY path on the board)
distance_k_cm = 9.0      # distance_cm ~= k / face_width_ratio (60 deg hfov, ~15 cm face); tune on the real head
far_cm = 300             # published when no face is seen
light_source = "camera"  # camera (exposure locked, ring light off) | ky054 (lid window; not fitted in this build)
light_every_s = 10       # room light sample period
ky054_lux_per_count = 0.25  # lux_est = KY-054 14-bit reading * this (uncalibrated; baselines are per person)
exposure_absolute = 156  # camera light backup: fixed v4l2 exposure; VERIFY range with `v4l2-ctl -l`
lux_per_unit = 2.0       # camera light backup: lux_est = mean Y * this
ppg_source = "camera"    # camera (this build: no KY-053, so the KY-039 has no ADC, D54) | auto (KY-039 first) | ky039
ppg_fallback_s = 4       # auto: switch to the camera after this long without a clean KY-039 batch
ppg_min_range = 30       # KY-039 batch peak-to-peak (ADC counts) below this = flat / unwired (unused without the KY-053)
ppg_max_value = 26000    # ... above this = pinned at the rail (3.3 V on the +-4.096 V range ~ 26400)
# MCU-side numbers (pins, debounce, ADS1115 rate): firmware/unoq-sensors/sketch/config.h

[mqtt]
host = "localhost"
port = 1883
heartbeat_s = 5

[local_api]
host = "0.0.0.0"
port = 8000
service_name = "Kaiku companion service"
graceful_shutdown_s = 3      # `make cloud-local`: on stop or --reload, open streams (GET /v1/me/stream) are cut after this long instead of being waited for; the apps reconnect

[uplink]
batch_s = 2
max_batch = 200
queue_path = "logs/uplink_queue.sqlite"
timeout_s = 10

[hub]
transcript_to_phone = true   # D63: while a phone or Mac is the robot's microphone, what the person said (Live's own
                             # transcription) goes to it as raw.hub.transcript for its transcript page. Never stored,
                             # never uplinked, never after a crisis phrase. false = her words never leave the hub
# Local session store (hub/kaiku_hub/store.py): the raw NUMBERS behind each ritual (tap times, pulse samples,
# distances, face box positions, dial turns) + the obs emitted from them. Stays at home, never uplinked, no
# images or audio. Audit / export / replay: tools/session.py.
store_enabled = true
store_path = "logs/hub_sessions.sqlite"
store_retention_days = 30   # sessions older than this are deleted when the next ritual starts
store_max_mb = 200          # then the oldest sessions go until the file is under this
presence_leave_s = 6        # distance comes from the face box (D39): a face turned away this long = the person left
presence_stale_s = 5        # no distance reading this long (camera off, UNO Q down) = presence unknown, not "here"
engagement_enabled = true   # obs.engagement: multi-cue session summary, only for an accepted conversation
head_mode = "auto"          # auto | follow | drive. auto: FOLLOW a head whose health/head says firmware = standalone
                            # (the ritual runs on the head, D44; the hub records it), else DRIVE the ritual itself
robot_home_id = ""          # home id the robot boards publish on (firmware secrets.h / UNO Q .env), if it differs from
                            # the person's record (KAIKU_HOME_ID). Empty = the same. Env: KAIKU_HUB_ROBOT_HOME_ID
head_stale_s = 15           # follow mode: no health/head this long (3 heartbeats) = the head is gone
follow_offer_every_s = 300  # follow mode: Kaiku's spoken invitation at the head's greeting ("press my ear to turn on
                            # our conversation"), at most this often; the head greets a face about once a minute
trace = true                # raw.hub.trace on the home broker, for the apps' "Kaiku bot" tab: Kaiku's own lines, the
                            # names of the tools the voice called, game cues, music and session open/close. Never
                            # the person's words; never stored or uplinked (raw.* stays at home). false = nothing

[ritual]
enabled_nudges = ["breathe", "drum", "daylight_walk"] # No Friendlink or iCBT task is implemented in this build.
greet_s = 20
dial_s = 45             # whole DIAL step: mood, energy, last night's sleep (3 ear turns)
breathe_s = 90
breathe_bpm = 6
drum_s = 45
nudge_s = 30
step_timeout_s = 120
phq9_mode = "laptop"    # laptop | spoken | both  (D10; spoken = PHQ9 step in the ritual when due)
phq9_every_days = 14
drum_idle_end_s = 6    # end DRUM early after this long without taps
post_mood_s = 15       # after drumming: window for the quick post-activity mood dial
hrv_window_s = 30      # HRV pre/post window at start/end of BREATHE
cooldown_s = 60        # min gap between rituals (demo mode)

[perception]
light_enabled = false # Current robot/demo omits light; raw light never enters cloud observations or context.
speech_window_s = 30 # bounded energy-only speech summary; longer turns are not scored
speech_min_voiced_s = 1.0 # silence/brief noise is missing speech evidence
speech_clip_fraction = 0.01 # near-rail PCM fraction invalidating a speech window
presence_near_cm = 80
presence_first_of_day_after_h = 4
tap_refractory_ms = 80
tap_force_max_g = 4.0   # force_mean = clip(peak_g / this, 0, 1)
light_window_min = 60
ppg_band_hz = [0.7, 3.5]
ppg_min_clean_ratio = 0.7
quality_min = 0.5

# Consensus / metric criteria (how each data input is used) live in config/criteria.toml.

[music]
bpm_min = 60     # VERIFY Lyria RealTime allowed BPM range
bpm_max = 200
out = "head"        # head | speaker | file. Where the drum music and its cues are heard. head = the robot head's own
                    # speaker, as PCM frames over the bus (kaiku/v1/<home>/audio/head/speaker): the hub needs no
                    # sound device. speaker = the hub machine's sound card. file = a WAV (KAIKU_MUSIC_FILE=<path>
                    # names it and wins over this setting). Env: KAIKU_MUSIC_OUT
head_lead_ms = 80   # head: the hub sends one 20 ms frame every 20 ms, this far ahead of real time (120 at most):
                    # the head keeps a short buffer and plays silence when it runs dry
head_gain = 1.0     # head: the level as generated (was 0.8: too quiet on the robot, 2026-11-14)

[robot_expression]
# A visible change in her expression during a robot conversation with the camera on (hub `_expression_cue`, D60).
# The robot's camera can count how much of a window she smiled, nothing finer. lower = she smiled earlier in this
# conversation (a window with at least `earlier_smile_min`) and in this window at most `lower_smile_max`;
# brighter = at least `brighter_smile_min`. Kaiku gets one private note and may ask one gentle question.
enabled = true
lower_smile_max = 0.03
earlier_smile_min = 0.12
brighter_smile_min = 0.35
min_coverage = 0.5         # share of the window with one usable face
every_s = 90               # at most one note this often
max_per_conversation = 3

[follow_track]
# Keeping her in view on a head that runs its own ritual (hub `_follow_track`, D62): when her face drifts past `edge`
# of the camera's picture the head turns a little toward her. Never while the speaker has sound, never in the rhythm
# game. If `max_misses` turns in a row do not bring her nearer the middle it pauses for `give_up_s`.
enabled = true
sign = 1            # 1 or -1: flip if the head turns AWAY from her (which way this motor turns for a positive pan)
edge = 0.45         # |x_norm| of the face (0 = middle, 1 = edge of the picture) past which it turns
speed = 0.35        # motor speed of one 600 ms turn, 0-1
every_s = 2.0
max_misses = 3
give_up_s = 60

[photo_time]
conversation_window_s = 10   # with her yes to the camera for this conversation (D61): one window of counting, repeated
# "Photo time!" on the robot (hub/kaiku_hub/rituals/photo_time.py): the sensors board's camera counts face signs
# (smiles, head movement) for this long and sends numbers only. No picture is taken or kept. Shown, not scored.
seconds = 8

[tap_back]
# "Tap it back" (D51): the robot's drum step as a rhythm game. Kaiku plays a short song at a tempo, the song goes
# quiet, she taps its beat back from memory; three levels a day. hub/kaiku_hub/rituals/tap_back.py (the flow),
# hub/kaiku_hub/perception/tap_back.py (the numbers). Recorded as obs.tap_back, read by no criteria metric.
mode = "auto"                 # auto: the game when a generated song can play (KAIKU_MUSIC=lyria and it started),
                              # otherwise free drumming as before | free: never | tap_back: always (with the hub's
                              # own plain beat, or the head's light alone, when no song can play). Env: KAIKU_TAP_BACK_MODE
level_bpm = [100, 126, 76]    # the tempo of each level's song: comfortable, clearly faster, slow (the hardest to hold)
level_vary_bpm = [6, 8, 4]    # each day the tempo is the level's plus or minus up to this (by the date: the same on
                              # a rerun, three other tempos the next day)
level_taps = [8, 8, 12]       # taps asked for; the band comes as soon as she has made them
listen_s = 8                  # seconds of the song she hears before it goes quiet
replay_listen_s = 6           # the same level a second time
song_wait_s = 6               # no sound of the song this long after asking for it: it is not coming (auto -> free drumming)
first_tap_s = 8               # her turn ends when no tap comes this long after the cue ...
idle_end_s = 2.5              # ... or this long after her last tap ...
turn_s = 25                   # ... or after this long whatever happens
cue_clear_s = 0.4             # taps count only this long after the cue has sounded: the head sends no tap while its speaker plays or about 0.3 s after, and her time starts only once the hub's speaker stream is quiet
min_taps = 4                  # fewer taps than this give no tempo (the level is offered once more)
perfect_pct = 4               # bands by tempo error, percent of the song's tempo: perfect up to this,
great_pct = 8                 # great up to this,
nice_pct = 15                 # nice up to this, beyond it "again"
steady_min = 0.85             # steadiness (1 - spread of the gaps) below this: perfect counts as great, great as nice
half_double = true            # tapping every other beat, or two to a beat, is compared with that (it is in time)
retries = 1                   # replays of a level after "again"; after that Kaiku moves on kindly
word_s = 0.3                  # seconds allowed per spoken word before the song or her turn starts (only when the voice is audible)
result_s = 0.8                # a breath after the band's chime and words, before the next thing
hold_every_s = 3              # follow mode: cmd.head {drum: hold} at least this often (the head lets go after 10 s without)
max_s = 170                   # the whole game ends kindly after this long

