[history]
# The person's own numbers (GET /v1/me/history, cloud/kaiku_cloud/history.py, D48): which measures the History tab
# shows, in which group, under which plain title. Groups come out in the order of [history.groups]; measures in
# the order below. A measure whose `key` is a config/criteria.toml metric takes that metric's obs, field, filter
# and daily aggregation, so its days are the practitioner side's numbers. A measure with its own `obs` is a
# reading that is stored but that no metric scores. A metric that is not listed here is not shown to the person.
# Titles and units are for the person: plain words, no clinical terms, no direction words.
default_days = 30
max_days = 90
sessions_per_measure = 30
session_values = 16   # the most numbers one session row may list: the contract's own limit (HistorySession.values),
                      # so a row is never cut short of it. A Health summary has thirteen numbers since D53 and its
                      # rows list seven (the day before's) or six (the night's); a test keeps every list within this
usual_scale = 1.0   # usual range = their own baseline median +/- this many spreads (as [insight].usual_scale)

[history.groups]
robot = "Robot"
games = "Games"
walks = "Walks and outings"
checkins = "Check-ins"
sleep_body = "Sleep and body"
mac = "Mac"
