# The numbers of one session, by observation type: [payload field, title, unit, decimals, format]. Only the ones a
# session really has are shown. A camera or face number appears only under "obs.face_signs" (the camera group,
# D52), never on another observation type.
# FORMATS (a measure's `format`, and the fifth item of a session number; left out = a plain number with its unit):
#   "clock"     the value is minutes after local midnight
#   "percent"   the value stays a share 0..1 in the API; the app shows value x 100 with "%". `unit` says what it is
#               a share of ("of the time") or is empty; `decimals` are those of the percent number (0 = "14 %")
#   "duration"  the value is minutes; the app shows "7 h 20 min" from 60 on, else "45 min". `unit` stays empty
# A measure's usual range is in the same format as its values. Only shares of TIME are percent; an index that
# merely runs from 0 to 1 (steadiness, how much the face moved) stays a number with a unit that says what it is.
# Which kind of session one is, where a measure lists several kinds: [payload field, { value = plain name }].
[history.session_label]
"obs.ritual" = ["step", { greet = "Hello", dial = "Check-in dials", breathe = "Breathing", drum = "Drumming", phq9 = "Questionnaire", nudge = "Suggestion", close = "Goodbye" }]
"obs.face_signs" = ["task", { firefly = "Firefly", pebbles = "Pebble path", lantern = "Lantern", seeds = "Seed shelf", watering = "Watering", tell = "Telling Kaiku about the day", breathe = "Breathing", check_in = "Check-in" }]

