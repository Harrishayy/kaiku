# ----- camera face signs during tasks (obs.face_signs, D52; docs/validation.md -> Face signs). With the person's
# opt-in "Camera during activities", the phone or Mac counts movements of the face while a game or the check-in chat
# runs: on the device, in memory, numbers only. They are movements, never emotions.
# ALL OF THEM: role = "shown" (see the header): against the person's OWN usual only, charted, citable, never a vote.
#   * one method per metric: ARKit blendshape coefficients and Vision landmarks are different instruments and are
#     never pooled into one usual. The full set reads the ARKit method (TrueDepth iPhone). The landmark method (Mac,
#     other iPhones) sends no smile, brow or gaze sign, and its blink rate, head movement and range are on other
#     scales: it gets a usual for the one sign it measures best, the range of expression, in games and in chats.
#   * one kind of task per metric: silent screen games (firefly, pebbles, lantern, seeds, watering) are one family;
#     the check-in chat is another (a face that is talking moves for that reason). "tell" and "breathe" are stored
#     and listed per session but read by no metric: speaking and slow breathing change the face by design.
#   * at_least: a session counts only with one usable face in 60 % of the frames, 20 s of sampling, and at least
#     half the frames its method takes in that time (the phone's face tracking looks 30 times a second: 300; the
#     landmark method 15 times: 150). A thinner capture keeps its provenance and feeds no usual.
#   * z_threshold 2.0 and baseline_min_days 5, as for the games: new, unvalidated, one or two sessions a day.
#   * counts_for_better = false: a livelier face than usual is not read as "better". The face is not a wellbeing meter.
#   * min_mad: there are no recordings of real day-to-day spread yet, so each floor is argued from what one session
#     can resolve and must be re-set from recordings before any of these is allowed to vote.
#   * weights are what each WOULD vote with once its `role` line is deleted. Together they stay below the Apps
#     group's worse_min_weight (0.95 < 1.0, tested): the camera alone can never turn the group worse.
# Stored and listed per session but with no usual: head_movement (its scale belongs to the method and is not fixed),
# gaze_on_share (near its ceiling in a game), brow shares (no direction we can argue), mouth_open_share (mostly
# speech in "tell" and the check-in), and the landmark method's blink rate (another scale, the least certain sign).
[[metric]]
name = "face_range"
label = "Expressiveness in games (camera, 0–1)"
family = "expression"
obs = "obs.face_signs"
field = "expression_range"
where = { task = ["firefly", "pebbles", "lantern", "seeds", "watering"], method = "arkit_blendshapes" }
at_least = { coverage = 0.6, samples = 300, duration_s = 20 }
agg = "mean"
worse_when = "down"         # less movement of the face than her usual: what interviews showed at higher severity (Girard 2014)
role = "shown"              # D52: delete this line to let it vote with the weight below
weight = 0.2
counts_for_better = false
z_threshold = 2.0
min_mad = 0.05              # a twentieth of the scale; the retired expressivity index used the same floor
baseline_min_days = 5
note = "overall variability of expression over the session (0-1), ARKit blendshapes"

[[metric]]
name = "face_smiles"
label = "Smiling in games (camera)"
unit = "ratio"
family = "expression"
obs = "obs.face_signs"
field = "smile_share"
where = { task = ["firefly", "pebbles", "lantern", "seeds", "watering"], method = "arkit_blendshapes" }
at_least = { coverage = 0.6, samples = 300, duration_s = 20 }
agg = "mean"
worse_when = "down"         # less smiling than her usual (Girard 2014: fewer AU 12 smiles at higher severity, in interviews)
role = "shown"              # D52: delete this line to let it vote with the weight below
weight = 0.2
counts_for_better = false
z_threshold = 2.0
min_mad = 0.04              # ~3.5 s of a 90 s game: below that a difference is one smile more or fewer
baseline_min_days = 5
note = "share of face frames with a smile above the method's threshold, ARKit blendshapes"

[[metric]]
name = "face_blinks"
label = "Blink rate in games (camera)"
unit = "per min"
family = "expression"
obs = "obs.face_signs"
field = "blinks_per_min"
where = { task = ["firefly", "pebbles", "lantern", "seeds", "watering"], method = "arkit_blendshapes" }
at_least = { coverage = 0.6, samples = 300, duration_s = 20 }
agg = "mean"
worse_when = "up"           # more blinking at the same screen task goes with time on task and tiredness (Stern 1994);
                            # the least certain direction here: concentration lowers it, dry eyes raise it
role = "shown"              # D52
weight = 0.0                # and no vote even without the role line, until its direction is shown in recordings
counts_for_better = false
z_threshold = 2.0
min_mad = 3.0               # a 90 s game holds ~20 blinks: counting error alone is about sqrt(20) / 1.5 min = 3 a minute
baseline_min_days = 5

[[metric]]
name = "face_range_chat"
label = "Expressiveness in chats (camera, 0–1)"
family = "expression"
obs = "obs.face_signs"
field = "expression_range"
where = { task = "check_in", method = "arkit_blendshapes" }
at_least = { coverage = 0.6, samples = 300, duration_s = 20 }
agg = "mean"
worse_when = "down"
role = "shown"              # D52: delete this line to let it vote with the weight below
weight = 0.2
counts_for_better = false
z_threshold = 2.0
min_mad = 0.06              # a talking face varies more from chat to chat than a playing one
baseline_min_days = 5
note = "the check-in chat: range of expression while talking with Kaiku"

[[metric]]
name = "face_smiles_chat"
label = "Smiling in chats (camera)"
unit = "ratio"
family = "expression"
obs = "obs.face_signs"
field = "smile_share"
where = { task = "check_in", method = "arkit_blendshapes" }
at_least = { coverage = 0.6, samples = 300, duration_s = 20 }
agg = "mean"
worse_when = "down"
role = "shown"              # D52: delete this line to let it vote with the weight below
weight = 0.2
counts_for_better = false
z_threshold = 2.0
min_mad = 0.05
baseline_min_days = 5

[[metric]]
name = "face_range_landmarks"
label = "Expressiveness in games (camera, landmark method, 0–1)"
family = "expression"
obs = "obs.face_signs"
field = "expression_range"
where = { task = ["firefly", "pebbles", "lantern", "seeds", "watering"], method = "vision_landmarks" }
at_least = { coverage = 0.6, samples = 150, duration_s = 20 }
agg = "mean"
worse_when = "down"
role = "shown"              # D52: delete this line to let it vote with the weight below
weight = 0.1                # 2-D landmarks, 15 looks a second: the coarser instrument
counts_for_better = false
z_threshold = 2.0
min_mad = 0.05
baseline_min_days = 5
note = "Mac and iPhones without TrueDepth: variability of mouth and eye geometry (Vision landmarks)"

[[metric]]
name = "face_range_chat_landmarks"
label = "Expressiveness in chats (camera, landmark method, 0–1)"
family = "expression"
obs = "obs.face_signs"
field = "expression_range"
where = { task = "check_in", method = "vision_landmarks" }
at_least = { coverage = 0.6, samples = 150, duration_s = 20 }
agg = "mean"
worse_when = "down"
role = "shown"              # D52: delete this line to let it vote with the weight below
weight = 0.05               # the coarser instrument, on a face that is talking
counts_for_better = false
z_threshold = 2.0
min_mad = 0.06
baseline_min_days = 5
note = "a check-in done on the Mac (or an iPhone without TrueDepth): the one sign this method gets a usual for"

