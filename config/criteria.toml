# ----- research-inspired games (docs/validation.md -> Games). All of them: against the person's OWN baseline only;
# warm-up sessions (the first 3 per game per device) never count (where warmup = false: practice effects); doubtful
# sessions arrive with envelope quality 0.2 and are skipped by quality_min; a stricter z (2.0); at least 5 baseline
# days; counts_for_better = false (getting better at a game is practice, not recovery); low weights, so one game
# alone can never make the Apps source "worse" (lantern 0.75 in total < worse_min_weight 1.0). No person_hard: a
# game never tells the person they did badly.
[[metric]]
name = "lantern_speed"
label = "Lantern response speed"
unit = "1/s"
family = "cognition"
obs = "obs.play_session"
field = "response_speed"
where = { game = "lantern", warmup = false }
agg = "mean"
worse_when = "down"
weight = 0.5
counts_for_better = false
z_threshold = 2.0
min_mad = 0.1               # ~10 ms at a 300 ms reaction
baseline_min_days = 5
note = "PVT-style simple reaction time: mean of 1000/RT over valid trials (daily in the path)"

[[metric]]
name = "lantern_variability"
label = "Lantern reaction variability"
unit = "CV"
family = "cognition"
obs = "obs.play_session"
field = "reaction_ms_cv"
where = { game = "lantern", warmup = false }
agg = "mean"
worse_when = "up"
weight = 0.25               # moves with lantern_speed: half of it
counts_for_better = false
z_threshold = 2.0
min_mad = 0.03
baseline_min_days = 5

[[metric]]
name = "seeds_throughput"
label = "Seed shelf pace"
unit = "right/min"
family = "cognition"
obs = "obs.play_session"
field = "throughput_per_min"
where = { game = "seeds", warmup = false }
agg = "mean"
worse_when = "down"
weight = 0.5
counts_for_better = false
z_threshold = 2.0
min_mad = 1.5
baseline_min_days = 5       # every third day in the path: ~2 weeks before it can speak
note = "symbol-digit substitution (processing speed), 90 s, a new pairing each session"

[[metric]]
name = "pebble_span"
label = "Pebble path length"
unit = "pebbles"
family = "cognition"
obs = "obs.play_session"
field = "span_max"
where = { game = "pebbles", warmup = false }
agg = "max"
worse_when = "down"
weight = 0.25               # a span moves in whole steps: coarse
counts_for_better = false
z_threshold = 2.0
min_mad = 1.0
baseline_min_days = 5

[[metric]]
name = "watering_effort"
label = "Watering: bigger plant chosen"
unit = "share"
family = "motivation"
obs = "obs.play_session"
field = "hard_choice_ratio"
where = { game = "watering", warmup = false }
agg = "mean"
worse_when = "down"
weight = 0.25               # the least established of the four (flowers, not money): a quarter
counts_for_better = false
z_threshold = 2.0
min_mad = 0.12              # one choice in eight
baseline_min_days = 5

