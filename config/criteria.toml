# PHQ-9 is too sparse (every 14 days) to baseline; it acts through the rules below and is charted separately.

# ---------------------------------------------------------------- rules: direct "worse" triggers

[[rule]]
name = "phq9_rise"
label = "PHQ-9 rose ≥ 5 points since the previous one"
family = "self_report"
obs = "obs.phq9"
field = "total"
kind = "rise_vs_previous"   # at_least | at_most | rise_vs_previous | drop_vs_previous
threshold = 5

[[rule]]
name = "phq9_high"
label = "PHQ-9 ≥ 10"
family = "self_report"
obs = "obs.phq9"
field = "total"
kind = "at_least"
threshold = 10
