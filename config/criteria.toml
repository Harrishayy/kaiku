# ----- more of the day from Apple Health (obs.wearable_daily, D53; docs/validation.md -> More of the day from Apple
# Health). Distance walked, time in daylight, walking heart rate, the night's sleep stages and the time awake in it:
# daily totals the phone reads from Apple Health, optional, absent when Health holds nothing (never a zero).
# ALL OF THEM: role = "shown" (see the header): against the person's OWN usual only, charted, citable, never a vote.
# The five measures above keep voting exactly as before, and the rule version does not change (tested).
# NOT VALIDATED HERE: no recording of a real person stands behind any direction or floor below. Each is argued.
#   * there is no sleep score: Apple gives apps none, so none is read and none is invented. Stages are what the
#     watch estimates from its own sensors; they are not a sleep-laboratory measurement.
#   * directions: less distance, less daylight, less deep sleep and more time awake than her usual are marked.
#     Walking heart rate (it follows the pace walked as much as anything else) and REM sleep (sleep-laboratory
#     studies of low mood describe more REM pressure, not fewer REM minutes) get a direction only so a chart can
#     mark a change: their weight is 0 even without the role line.
#   * the distance is the same walking the steps already count: it would vote twice, so its weight is 0 too. It is
#     here because a person and a practitioner read kilometres more easily than steps.
#   * weights are what each WOULD vote with once its `role` line is deleted: 0.75 together, below the Watch
#     group's worse_min_weight (1.0, tested), so these alone could never turn the group worse.
#   * z_threshold 2.0 (new and unvalidated, as for the games) and counts_for_better = false (more daylight or
#     more deep sleep than usual is not read as "better").
#   * min_mad: argued from what one day's figure can resolve; re-set from recordings before any of these may vote.
# Stored and listed for the person, read by no metric: sleep_core_min (what is left of the night once deep and
# REM are taken out: it says nothing the three numbers beside it do not).
[[metric]]
name = "day_distance"
label = "Distance walked (day)"
unit = "km"
family = "behaviour"
obs = "obs.wearable_daily"
day_field = "date" # target day; latest capture timestamp wins when a summary is corrected
field = "distance_km"
agg = "last"
worse_when = "down"
role = "shown"              # D53
weight = 0.0                # the same walking as daily_steps: it would vote twice
counts_for_better = false
z_threshold = 2.0
min_mad = 0.4               # a few hundred metres: one short errand more or less

[[metric]]
name = "day_daylight"
label = "Time in daylight (watch)"
unit = "min"
family = "behaviour"
obs = "obs.wearable_daily"
day_field = "date" # target day; latest capture timestamp wins when a summary is corrected
field = "daylight_min"
agg = "last"
worse_when = "down"         # less time outdoors in daylight than her usual
role = "shown"              # D53: delete this line to let it vote with the weight below
weight = 0.25
counts_for_better = false
z_threshold = 2.0
min_mad = 10.0              # one short walk more or less

[[metric]]
name = "walking_hr"
label = "Walking heart rate (watch)"
unit = "bpm"
family = "physiology"
obs = "obs.wearable_daily"
day_field = "date" # target day; latest capture timestamp wins when a summary is corrected
field = "walking_hr_bpm"
agg = "last"
worse_when = "up"           # as for the resting heart rate; but a brisker walk raises it too
role = "shown"              # D53
weight = 0.0                # and no vote even without the role line, until its direction is shown in recordings
counts_for_better = false
z_threshold = 2.0
min_mad = 3.0               # a guess: the pace of the day's walking alone moves it

[[metric]]
name = "deep_sleep"
label = "Deep sleep (watch)"
unit = "min"
family = "physiology"
obs = "obs.wearable_daily"
day_field = "date" # target day; latest capture timestamp wins when a summary is corrected
field = "sleep_deep_min"
agg = "last"
worse_when = "down"
role = "shown"              # D53: delete this line to let it vote with the weight below
weight = 0.25
counts_for_better = false
z_threshold = 2.0
min_mad = 10.0              # a wrist estimates stages; ten minutes is a guess at what one night's figure resolves

[[metric]]
name = "rem_sleep"
label = "REM sleep (watch)"
unit = "min"
family = "physiology"
obs = "obs.wearable_daily"
day_field = "date" # target day; latest capture timestamp wins when a summary is corrected
field = "sleep_rem_min"
agg = "last"
worse_when = "down"         # a charting convention only (see above)
role = "shown"              # D53
weight = 0.0                # and no vote even without the role line
counts_for_better = false
z_threshold = 2.0
min_mad = 12.0

[[metric]]
name = "awake_night"
label = "Awake in the night (watch)"
unit = "min"
family = "physiology"
obs = "obs.wearable_daily"
day_field = "date" # target day; latest capture timestamp wins when a summary is corrected
field = "sleep_awake_min"
agg = "last"
worse_when = "up"           # more time awake between falling asleep and the last waking than her usual
role = "shown"              # D53: delete this line to let it vote with the weight below
weight = 0.25
counts_for_better = false
z_threshold = 2.0
min_mad = 8.0               # a couple of brief wakings

# PHQ-9 is too sparse (every 14 days) to baseline; it acts through the rules below and is charted separately.

# ---------------------------------------------------------------- rules: direct "worse" triggers

[[rule]]
name = "phq9_rise"
label = "PHQ-9 rose ≥ 5 points since the previous one"
family = "self_report"
obs = "obs.phq9"
field = "total"
kind = "rise_vs_previous"   # at_least | at_most | rise_vs_previous | drop_vs_previous
threshold = 5

[[rule]]
name = "phq9_high"
label = "PHQ-9 ≥ 10"
family = "self_report"
obs = "obs.phq9"
field = "total"
kind = "at_least"
threshold = 10
