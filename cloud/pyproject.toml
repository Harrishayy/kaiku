[project]
name = "kaiku-cloud"
version = "0.1.0"
description = "Kaiku cloud: Modal app, API, analytics, Gemma briefs"
requires-python = ">=3.11"
dependencies = [
    "kaiku-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "httpx>=0.27",
    "modal>=1.0",
    "tzdata>=2024.1",
    "google-genai>=2.25",
]

[tool.uv.sources]
kaiku-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaiku_cloud"]
