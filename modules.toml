emits = ["cmd.hub", "obs.safety_flag", "obs.vision_note"]
http = ["GET /v1/discovery", "POST /v1/events", "GET /v1/commands", "POST /v1/commands/{command_id}/ack", "GET /v1/nudge", "GET /v1/patients", "GET /v1/patients/{id}/consensus",
        "GET /v1/patients/{id}/timeline", "GET /v1/patients/{id}/phq9", "POST /v1/patients/{id}/actions", "POST /v1/patients/{id}/ask", "GET /v1/patients/{id}/tasks",
        "GET /v1/me", "GET /v1/events", "PUT /v1/health/{home_id}", "GET /v1/health", "POST /v1/admin/recompute",
        "POST /v1/admin/reset", "GET /v1/admin/criteria", "PUT /v1/admin/criteria", "POST /v1/admin/criteria/preview",
        "GET /v1/eval", "GET /healthz", "GET /v1/voice", "GET /v1/voice/{line_key}", "POST /v1/voice/say", "POST /v1/vision/look",
