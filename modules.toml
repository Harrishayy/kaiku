# Module registry — GROUND TRUTH for what modules exist and how they connect.
#
# Every top-level component is listed here. `make agents` / `make test` check that:
#   - each module folder has exactly one doc, AGENTS.md, with the standard sections (no README/CLAUDE/GEMINI files)
#   - every type in emits/consumes exists in kaiku_contracts, and every obs type has a producer and a consumer
#   - the module index in the root AGENTS.md matches this file (regenerated by `make agents`)
#
# Add a module:    copy docs/templates/module/AGENTS.template.md in as AGENTS.md, fill it in, add a [[module]] entry, `make agents`.
# Remove a module: delete its folder + entry, `make agents && make test`. Nothing imports a module (contracts only),
#                  so removal can only break message flow, which the checker reports.
#
# kind: library | node | service | app | firmware | harness | docs
# removable: true if the demo still runs without it (the system degrades, never crashes).
# Message types use kaiku_contracts names (obs.*, raw.*, cmd.*, health). http = endpoints served or called.

[[module]]
name = "contracts"
path = "contracts"
owner = "all"
kind = "library"
summary = "Message envelope, payloads, topics, API models, consensus source map; shared Bus/config/jlog"
removable = false

[[module]]
name = "hub"
path = "hub"
owner = "B"
kind = "node"
summary = "Robot orchestrator: perception, ritual state machine, safety gate, Gemini Live / Lyria adapters, uplink"
removable = false
consumes = ["raw.head.tap", "raw.head.ear", "raw.head.pan", "raw.head.button", "raw.sensors.ppg", "raw.sensors.distance",
            "raw.sensors.light", "raw.sensors.button", "raw.sensors.hall", "raw.hub.face", "raw.sensors.face_signs", "cmd.hub",
            "cmd.sensors", "obs.friend_link", "health"]
emits = ["obs.presence", "obs.self_report", "obs.hrv_session", "obs.drum_session", "obs.tap_back", "obs.speech_features",
         "obs.light_level", "obs.engagement", "obs.ritual", "obs.intervention_response", "obs.nudge_offered",
         "obs.nudge_outcome", "obs.friend_link", "obs.phq9", "obs.safety_flag", "cmd.head", "cmd.sensors",
         "cmd.friendlink", "raw.hub.face", "raw.hub.trace", "obs.face_signs", "health"]
http = ["POST /v1/events", "GET /v1/commands", "GET /v1/nudge", "PUT /v1/health/{home_id}", "GET /v1/voice/{line_key}",
        "POST /v1/voice/say", "POST /v1/companion/session", "POST /v1/companion/tool", "POST /v1/companion/episode",
        "POST /v1/commands/{command_id}/ack"]

