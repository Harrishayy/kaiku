# Module registry — GROUND TRUTH for what modules exist and how they connect.
#
# Every top-level component is listed here. `make agents` / `make test` check that:
#   - each module folder has exactly one doc, AGENTS.md, with the standard sections (no README/CLAUDE/GEMINI files)
#   - every type in emits/consumes exists in kaiku_contracts, and every obs type has a producer and a consumer
#   - the module index in the root AGENTS.md matches this file (regenerated by `make agents`)
#
# Add a module:    copy docs/templates/module/AGENTS.template.md in as AGENTS.md, fill it in, add a [[module]] entry, `make agents`.
# Remove a module: delete its folder + entry, `make agents && make test`. Nothing imports a module (contracts only),
#                  so removal can only break message flow, which the checker reports.
#
# kind: library | node | service | app | firmware | harness | docs
# removable: true if the demo still runs without it (the system degrades, never crashes).
# Message types use kaiku_contracts names (obs.*, raw.*, cmd.*, health). http = endpoints served or called.

[[module]]
name = "contracts"
path = "contracts"
owner = "all"
kind = "library"
summary = "Message envelope, payloads, topics, API models, consensus source map; shared Bus/config/jlog"
removable = false

[[module]]
name = "hub"
path = "hub"
owner = "B"
kind = "node"
summary = "Robot orchestrator: perception, ritual state machine, safety gate, Gemini Live / Lyria adapters, uplink"
removable = false
consumes = ["raw.head.tap", "raw.head.ear", "raw.head.pan", "raw.sensors.ppg", "raw.sensors.distance",
            "raw.sensors.light", "raw.sensors.button", "raw.sensors.hall", "raw.hub.face", "cmd.hub",
            "obs.friend_link", "health"]
emits = ["obs.presence", "obs.self_report", "obs.hrv_session", "obs.drum_session", "obs.speech_features",
         "obs.light_level", "obs.ritual", "obs.intervention_response", "obs.nudge_offered", "obs.nudge_outcome",
         "obs.friend_link", "obs.phq9", "obs.safety_flag", "cmd.head", "cmd.sensors", "cmd.friendlink",
         "raw.hub.face", "health"]
http = ["POST /v1/events", "GET /v1/commands", "GET /v1/nudge", "PUT /v1/health/{home_id}"]

[[module]]
name = "cloud"
path = "cloud"
owner = "C"
kind = "service"
summary = "Modal app: ingest, SQLite, baselines, per-source verdicts, consensus v1, bandit, Gemma explanations, simulation, web hosting"
removable = false
consumes = ["obs.presence", "obs.self_report", "obs.hrv_session", "obs.drum_session", "obs.speech_features",
            "obs.light_level", "obs.ritual", "obs.outing", "obs.laptop_session", "obs.phq9",
            "obs.intervention_response", "obs.nudge_offered", "obs.nudge_outcome", "obs.friend_link",
            "obs.safety_flag", "obs.screen_activity", "obs.play_session", "obs.wearable_daily"]
emits = ["cmd.hub", "obs.safety_flag"]
http = ["POST /v1/events", "GET /v1/commands", "GET /v1/nudge", "GET /v1/patients", "GET /v1/patients/{id}/consensus",
        "GET /v1/patients/{id}/timeline", "GET /v1/patients/{id}/phq9", "POST /v1/patients/{id}/actions",
        "GET /v1/me", "GET /v1/events", "PUT /v1/health/{home_id}", "GET /v1/health", "POST /v1/admin/recompute",
        "POST /v1/admin/reset", "GET /v1/admin/criteria", "PUT /v1/admin/criteria", "POST /v1/admin/criteria/preview",
        "GET /v1/eval", "GET /healthz", "GET /v1/voice", "GET /v1/voice/{line_key}",
        "POST /v1/companion/session", "POST /v1/companion/tool", "POST /v1/companion/episode", "GET /v1/me/memories",
        "DELETE /v1/me/memories/{id}", "DELETE /v1/me/memories", "PUT /v1/me/memory_settings"]

[[module]]
name = "web"
path = "apps/web"
owner = "D"
kind = "app"
summary = "Next.js static export: clinician dashboard, /me, laptop /session, /phq9, /consent, /live, /health, /eval, /tune"
removable = true
emits = ["obs.laptop_session", "obs.phq9", "obs.safety_flag"]
http = ["POST /v1/events", "GET /v1/patients", "GET /v1/patients/{id}/consensus", "GET /v1/patients/{id}/timeline",
        "GET /v1/patients/{id}/phq9", "POST /v1/patients/{id}/actions", "GET /v1/me", "GET /v1/events",
        "GET /v1/health", "GET /v1/eval", "GET /healthz", "GET /v1/admin/criteria", "PUT /v1/admin/criteria",
        "POST /v1/admin/criteria/preview"]

