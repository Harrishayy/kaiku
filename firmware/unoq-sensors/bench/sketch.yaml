# Library profile for every UNO Q bench sketch (and the main sketch): copy next to sketch.ino as sketch.yaml.
# arduino-cli profiles install only what is listed, so every dependency is pinned here (verified 2026-11-14).
profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      - Arduino_RouterBridge (0.4.4)
      - Arduino_RPClite (0.3.1)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.2)
      - DebugLog (0.8.4)
      - MsgPack (0.4.2)
      - Arduino_Modulino (0.10.0)
      - ArduinoGraphics (1.1.5)
      - Arduino_HS300x (1.0.1)
      - Arduino_LPS22HB (1.0.3)
      - Arduino_LSM6DSOX (1.1.2)
      - Arduino_LTR381RGB (1.0.1)
      - SHT31 (0.5.3)
      - STM32duino VL53L4CD (1.0.5)
      - STM32duino VL53L4ED (1.0.1)
default_profile: default
