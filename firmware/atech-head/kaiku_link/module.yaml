# Custom Atech module (atech SDK: modules_path in ../project.yaml). VERIFY field shapes with `atech guide`:
# the public docs list id, templates, usage, events, actions, lib_deps but show no full example.
id: kaiku_link
usage: "Kaiku head link: Wi-Fi + MQTT contract messages, button events, open-loop pan motor, purr"
templates:
  include: '#include "kaiku_link.h"'
events: []      # we print full envelopes on Serial ourselves, not Atech events
actions: []
lib_deps:
  - knolleary/PubSubClient@^2.8
  - bblanchon/ArduinoJson@^7.2
