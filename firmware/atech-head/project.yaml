# Kaiku Atech board (14-port, ESP32-S3), in the body; display, knob and mic are cabled up the neck into the head.
# Build offline: `atech validate . && atech build . && atech upload .`
# NOT WHAT THE ROBOT RUNS: this is the earlier, hub-driven MQTT firmware for the earlier design (display 3-4, lid
# button 7, LED grids 11/14, motor 13: all 12 ports). The robot as built runs standalone/ (no display, button or LED
# grids; motor 14, orientation sensor 13; hardware/wiring.md). Confirm GPIOs with `atech validate`; never hard-code them.
#
# The two points below were open before the first build. Since then this file has compiled and, on 2026-11-14
# 06:30, run on the board with the earlier parts (health, pan reports, button, knob, display eyes:
# docs/progress.md), so the names below are the ones that built. Check with `atech info <module>` after an SDK change:
#   - whether `code:` takes `setup:` as well as `loop:` (the docs only show loop)
#   - C++ method names. The docs' C++ example uses camelCase (`btn.wasPressed()`, `led.setAll(..); led.show()`, Knob
#     `getPosition` / `isPressed` / `enableRing`), so camelCase is used below. Only this file touches them.
name: kaiku-head
board: 14port
# kaiku_link is a plain PlatformIO library linked in place (kaiku_link/library.json; Atech modules must sit on a real
# port). The path is relative to build/.
libraries:
  - kaiku_link=symlink://../kaiku_link
modules:
  - {id: speaker,             instance: spk,   ports: [1, 2]}    # 1-2
  - {id: st7735_tft,          instance: tft,   ports: [3, 4]}    # 3-4, eyes (head, tuning window)
  - {id: rotary_encoder, instance: knob,  ports: [5, 6]}    # 5-6, left ear dial
  - {id: dc_motor,            instance: motor, port: 13}   # pan, 12:40 gear
  - {id: microphone,          instance: mic,   ports: [9, 10]}    # 9-10, right ear: PCM frames to the hub only while it holds the mic open
  - {id: button,       instance: btn,   port: 7}    # lid; long press = "I'm not OK" (hub decides, >= 2 s)
  # no LED grids in this build (2026-11-14): ports 11 and 14 free
code:
  globals: |
    #include "kaiku_link.h"
  setup: |
    HeadIO io;
    io.buttonDown   = []() { return btn.isPressed(); };
    io.knobPosition = []() { return (int32_t)knob.getPosition(); };
    io.knobDown     = []() { return knob.isPressed(); };
    io.knobRing     = [](bool on) { knob.enableRing(on); };
    io.displayFill  = [](uint16_t c) { tft.fillScreen(c); };
    io.displayRect  = [](int16_t x, int16_t y, int16_t w, int16_t h, uint16_t c) { tft.fillRect(x, y, w, h, c); };
    io.ledsFill     = [](uint8_t r, uint8_t g, uint8_t b) { (void)r; (void)g; (void)b; };   // no LED grids fitted
    io.motorSpeed   = [](int s) { motor.setSpeed(s); };
    io.motorBrake   = []() { motor.stop(); };   // coast; the motor needs a power module on the 12 V rail (USB-C alone leaves it dead, bench 2026-11-14)
    io.tone         = [](uint16_t hz, uint16_t ms, float v) { spk.setVolume(v); spk.playNote(hz, ms); };
    io.speakerStop  = []() { spk.stop(); };
    // Audio streams (kaiku_link/head_audio.h): the hub's song, cues and voice out, the microphone in.
    io.pcmWrite     = [](const int16_t* s, int n, float v) { spk.setVolume(v); spk.writeSamples(s, n); };   // blocking; audio task only
    io.toneBusy     = []() { return spk.isPlaying(); };
    io.micTap       = [](void (*cb)(const int16_t*, int, void*), void* ctx) { mic.onAudio(cb, ctx); };
    io.displayText  = [](const char* t, int16_t x, int16_t y, uint8_t s, uint16_t c) { tft.displayText(t, x, y, s, c); };   // the help screen's lines
    knob.setAcceleration(false);   // one count per click; the driver accelerates fast turns (up to 5x) by default
    tft.setDirectMode(true);   // draws go straight to the screen; canvas mode would need tft.display() after every change
    kaiku::begin(io);
  loop: |
    knob.update();
    kaiku::tick();
