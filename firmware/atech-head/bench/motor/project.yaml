# Bench: Atech DC motor alone on port 13 (pan, 12:40 gear). Low speed, short pulses, ramped. Hold the head; nothing else is driven.
# VERIFY method names with `atech info dc_motor` (camelCase: setSpeed(-255..255) / brake).
name: bench-motor
board: 14port
modules:
  - {id: dc_motor, instance: motor, port: 13}
code:
  loop: |
    static int step = 0; static uint32_t next = 3000;
    const int sp[] = {80, 0, -80, 0, 160, 0, -160, 0};
    const char* nm[] = {"slow_right", "brake", "slow_left", "brake", "right", "brake", "left", "brake"};
    if (step < 8 && millis() >= next) {
      for (int s = 0; s <= abs(sp[step]); s += 20) { motor.setSpeed(sp[step] > 0 ? s : -s); delay(12); }  // ~100 ms ramp
      if (sp[step] == 0) motor.stop();  // NOT brake(): both lines HIGH ran the real motor at full speed (bench 2026-11-14)
      Serial.printf("{\"event\":\"pulse\",\"name\":\"%s\",\"speed\":%d}\n", nm[step], sp[step]);
      next = millis() + (sp[step] == 0 ? 700 : 300);
      step++;
      if (step == 8) Serial.println("{\"event\":\"done\"}");
    }
