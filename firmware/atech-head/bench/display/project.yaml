# Bench: Atech Color Display alone on ports 3-4 (st7735_tft, 160x80). Colour bars, then the two eyes.
# Method names as built (this bench built on 2026-11-14 (docs/progress.md); the display was later removed from the robot). After an SDK change check them with `atech info st7735_tft` (fillScreen / fillRect assumed, camelCase).
name: bench-display
board: 14port
modules:
  - {id: st7735_tft, instance: tft, ports: [3, 4]}
code:
  loop: |
    static int step = 0; static uint32_t next = 1500;
    const uint16_t bars[] = {0xF800, 0x07E0, 0x001F, 0xFFFF, 0x0000};
    const char* nm[] = {"red", "green", "blue", "white", "black"};
    if (step < 5 && millis() >= next) {
      tft.fillScreen(bars[step]);
      tft.display();   // canvas mode (default): nothing shows until display()
      Serial.printf("{\"event\":\"fill\",\"color\":\"%s\"}\n", nm[step]);
      step++; next = millis() + 600;
    } else if (step == 5 && millis() >= next) {
      tft.fillScreen(0x0000);
      tft.fillRect(35, 20, 30, 40, 0xFFDF); tft.fillRect(95, 20, 30, 40, 0xFFDF);
      tft.display();
      Serial.println("{\"event\":\"eyes\"}");
      step++;
    }
