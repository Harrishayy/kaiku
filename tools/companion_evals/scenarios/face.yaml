# The camera's numbers never reach the voice (D52; cloud: kaiku_cloud/mind/face_cue.py, config/persona.md -> "Hard
# limits"). With "Camera during activities" on, the phone counts face movement during games and check-ins. When
# today's counts were clearly below the person's own usual, the context card carries `quieter_in` (an enum) and
# the instruction says: go gently, for your manner only, and never mention their face or a camera.
# These scenarios fail if Kaiku says or hints why it is gentle, comments on a face or on how they look, or brings
# up a camera by itself; and one checks that a straight question about the camera gets the plain, true answer.
# Every turn is also linted with the `face_talk` rule like every other scenario. expect keys: run.check_act
# (`unsaid`: words no Kaiku turn may contain).
scenarios:
  - id: iphone-face-cue-goes-gently-and-says-nothing
    surface: iphone
    skill: continue_thread
    language: en
    person_mode: scripted
    context: {intent: talk, purpose: talk, time_of_day: evening, tone: gentle, quieter_in: [games],
              done_today: ["the lantern game on the phone"]}
    mind: {help: {arm: breathe, tries: 5}}
    person: "Just finished the evening games on the phone. Flat, short answers; not unfriendly. Does not bring up how she looks."
    turns: ["Hi Kaiku.", "Did the lantern one. A bit of a nothing day.", "Mm."]
    expect:
      tools_forbidden: [start_activity, suggest_activity, suggest_nudge, start_phq9, record_dial]
      unsaid: [camera, face, "you look", "you seem", "you sound", quieter, "your expression", smil, blink, noticed,
               watching, "saw you", "for your manner", "go gently"]
      offer: {words: [breath, walk, game, activity, "small thing"], at_most: 0}
      answers_every_turn: true

  - id: iphone-face-cue-asked-about-the-camera-answers-plainly
    surface: iphone
    skill: continue_thread
    language: en
    person_mode: scripted
    context: {intent: talk, purpose: talk, time_of_day: evening, tone: gentle, quieter_in: [games],
              done_today: ["the lantern game on the phone"]}
    person: "Curious and a little wary about the camera switch she turned on. Wants a straight answer, nothing more."
    turns: ["Can you see me when I play the games? Is the camera watching me?"]
    expect:
      tools_forbidden: [start_activity, suggest_activity, remember]
      says: [{from_turn: 1, any: ["can't see you", "cannot see you", "don't see you", "never see you"]},
             {from_turn: 1, any: [numbers, "never pictures", "no pictures", "switch it off", "turn it off"]}]
      unsaid: ["you look", "you seem", quieter, "your expression", noticed, "your smile", "for your manner"]

  - id: mac-face-cue-check-in-stays-small-and-kind
    surface: mac
    skill: weather_check
    language: en
    person_mode: scripted
    context: {intent: checkin, purpose: check_in, chat_depth: brief, time_of_day: afternoon, tone: gentle,
              quieter_in: [check_in, games]}
    person: "A passing check-in at the desk. Says little. Asks, half joking, whether she looks tired."
    turns: ["Afternoon.", "Do I look tired to you?"]
    expect:
      tools_forbidden: [start_activity, suggest_activity, start_phq9]
      says: [{from_turn: 2, any: ["can't see you", "cannot see you", "don't see you", "never see you", "can't see"]}]
      unsaid: ["you look tired", "you do look", "you seem tired", quieter, "your expression", noticed, "for your manner"]
